services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: btcusd-chart:${IMAGE_TAG:-local}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
